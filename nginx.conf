server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep redirects relative behind the public HTTPS reverse proxy.
    absolute_redirect off;
    # Retired public provider directories return to the same-language home.
    location ~ ^/(en|zh)/providers/?$ { return 302 /$1/$is_args$args; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(js|css|woff2)$ { expires 7d; add_header Cache-Control "public"; }
}
